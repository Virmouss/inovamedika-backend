services:
  # ==========================================
  # Database Service: PostgreSQL
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: inovamedika-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: inovamedika_clinic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inovamedika_clinic"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  # ==========================================
  # Backend API Service: Node.js Express
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inovamedika-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: inovamedika_clinic
      DB_PORT: 5432
      JWT_SECRET: inovamedika_jwt_secret_production_key_2026
      SEED_DATA: "true"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network

# ==========================================
# Volumes and Networks
# ==========================================
volumes:
  postgres_data:
    driver: local

networks:
  backend-network:
    driver: bridge
